services:
   # Node.js server -- Render instala Wasp y compila desde fuente
  - type: web
    name: doctoria-server
    runtime: node
    rootDir: app
    plan: free
    region: oregon
    branch: main
    buildCommand: >-
      npm install -g @wasp.sh/wasp-cli@0.25 &&
      export PATH="$(npm prefix -g)/bin:$PATH" &&
      wasp install &&
      wasp build &&
      cd .wasp/out/server &&
      npm install &&
      npx prisma generate --schema=../db/schema.prisma &&
       npm run bundle
     startCommand: cd .wasp/out/server && (npm run db-migrate-prod || true) && npx prisma db push --accept-data-loss --schema=../db/schema.prisma && (WASP_DB_SEED_NAME=seedSyntheticClinicalData node --enable-source-maps -r dotenv/config bundle/dbSeed.js || true) && NODE_ENV=production npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doctoria-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WASP_SERVER_URL
        sync: false
      - key: WASP_WEB_CLIENT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: NODE_VERSION
        value: "24"

  # React client -- sitio estático construido con Vite
  - type: web
    name: doctoria-client
    runtime: static
    rootDir: app
    branch: main
    buildCommand: >-
      npm install -g @wasp.sh/wasp-cli@0.25 &&
      export PATH="$(npm prefix -g)/bin:$PATH" &&
      wasp install &&
      wasp build &&
      npx vite build
    staticPublishPath: .wasp/out/web-app/build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /200.html

databases:
  - name: doctoria-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
